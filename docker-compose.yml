version: '3.8'

services:
  kbo-bot:
    build:
      context: .
      dockerfile: Dockerfile.kbot
    container_name: kbo-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
    volumes:
      - kbo_state:/data
    dns:
      - 8.8.8.8
      - 8.8.4.4

volumes:
  kbo_state:
