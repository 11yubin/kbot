version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "80:5678"
    env_file:
      - .env
    environment:
      - GENERIC_TIMEZONE=Asia/Seoul
      - TZ=Asia/Seoul
      - N8N_HOST=0.0.0.0
      - N8N_EDITOR_BASE_URL=http://152.69.238.106:5678
      - WEBHOOK_URL=http://152.69.238.106:5678
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n

  kbo-bot:
    build:
      context: .
      dockerfile: Dockerfile.kbot
    container_name: kbo-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
    volumes:
      - kbo_state:/data
    dns:
      - 8.8.8.8
      - 8.8.4.4

volumes:
  n8n_data:
  kbo_state:
