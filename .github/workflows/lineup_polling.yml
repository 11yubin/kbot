# .github/workflows/lineup_polling.yml
name: KBO Lineup Polling

on:
  schedule:
    # test용
    - cron: '10 4 * * *'

    # - cron: '*/5 2-9 * * 1-5' # Weekdays 11 AM - 6 PM KST (UTC 02:00-09:00)
    # - cron: '*/5 2-5 * * 0,6' # Weekends 11 AM - 2 PM KST (UTC 02:00-05:00)
  workflow_dispatch:

jobs:
  poll-lineup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests pytz

      - name: Run polling script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_CHAT_ID: ${{ secrets.TELEGRAM_BOT_CHAT_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python scripts/lineup_polling.py
